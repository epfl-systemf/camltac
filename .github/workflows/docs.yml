name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'theories/**'
      - 'dune'
      - 'dune-project'
      - 'rocq-camltac.opam'
      - '.github/workflows/docs.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"

      - name: Set-up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Add Rocq-released Opam repository
        run: opam repo add rocq-released https://rocq-prover.github.io/opam/released/

      - name: Install Camltac and dependencies
        run: |
          # odoc is required for MLtac2 APIs; VSRocq is a dependency of Alectryon
          opam install odoc vsrocq-language-server rocq-stdlib ./rocq-camltac.opam

      - name: Install Python dependencies
        run: pip install -r docs/requirements.txt

      - name: Build documentation
        run: opam exec -- make -C docs clean html SPHINXOPTS="--keep-going"

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
