name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'src/**'
      - 'theories/**'
      - 'dune'
      - 'dune-project'
      - 'rocq-camltac.opam'
      - '.github/workflows/build.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ ubuntu-latest ]
        rocq_version: [ "9.0", "9.1", "9.2", "9.3", "dev" ]
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Camltac on Rocq ${{ matrix.rocq_version }}
        uses: coq-community/docker-coq-action@v1
        with:
          opam_file: 'rocq-camltac.opam'
          coq_version: ${{ matrix.rocq_version }}